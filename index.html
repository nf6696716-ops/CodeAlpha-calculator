<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator - Task 2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: 'Segoe UI', Arial;}
body{background:linear-gradient(135deg,#0B3D91,#4CAF50);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;}
.calculator{background:white;width:100%;max-width:350px;border-radius:20px;box-shadow:0 15px 35px rgba(0,0,0,0.3);overflow:hidden;padding:20px;}
h2{text-align:center;color:#0B3D91;margin-bottom:15px;}
#display{width:100%;height:70px;background:#f1f8e9;border:none;border-radius:12px;text-align:right;font-size:32px;padding:15px;color:#222;outline:none;margin-bottom:15px;letter-spacing:1px;}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
button{height:60px;border:none;border-radius:12px;font-size:20px;cursor:pointer;transition:0.2s;background:#f5f5f5;}
button:hover{transform:translateY(-2px);box-shadow:0 4px 8px rgba(0,0,0,0.15);}
.btn-op{background:#e3f2fd;color:#0B3D91;font-weight:bold;}
.btn-eq{background:#4CAF50;color:white;font-weight:bold;grid-column:span 2;}
.btn-clear{background:#ffcdd2;color:#c62828;}
.btn-zero{grid-column:span 2;}
</style>
</head>
<body>

<div class="calculator">
  <h2>🧮 Calculator</h2>
  <input type="text" id="display" placeholder="0" readonly>
  <div class="buttons">
    <button class="btn-clear" onclick="clearDisplay()">C</button>
    <button onclick="deleteOne()">⌫</button>
    <button class="btn-op" onclick="append('/')">÷</button>
    <button class="btn-op" onclick="append('*')">×</button>
    
    <button onclick="append('7')">7</button>
    <button onclick="append('8')">8</button>
    <button onclick="append('9')">9</button>
    <button class="btn-op" onclick="append('-')">-</button>
    
    <button onclick="append('4')">4</button>
    <button onclick="append('5')">5</button>
    <button onclick="append('6')">6</button>
    <button class="btn-op" onclick="append('+')">+</button>
    
    <button onclick="append('1')">1</button>
    <button onclick="append('2')">2</button>
    <button onclick="append('3')">3</button>
    <button onclick="append('.')">.</button>
    
    <button class="btn-zero" onclick="append('0')">0</button>
    <button class="btn-eq" onclick="calculate()">=</button>
  </div>
  <p style="text-align:center;margin-top:12px;font-size:12px;color:gray;">Bonus: Keyboard Support Enabled ⌨️</p>
</div>

<script>
let display = document.getElementById('display');

function append(val){
  if(display.value=='0' && val!='.') display.value='';
  display.value += val;
}
function clearDisplay(){ display.value=''; }
function deleteOne(){ display.value = display.value.slice(0,-1); }
function calculate(){
  try{
    // Safe eval
    let result = eval(display.value);
    if(result===undefined) return;
    display.value = result;
  }catch{
    display.value = 'Error';
    setTimeout(clearDisplay,1000);
  }
}
// Bonus: Keyboard Support
document.addEventListener('keydown', e=>{
  if((e.key>='0' && e.key<='9') || ['+','-','*','/','.'].includes(e.key)){
    append(e.key);
  } else if(e.key=='Enter' || e.key=='='){ calculate(); }
  else if(e.key=='Backspace'){ deleteOne(); }
  else if(e.key.toLowerCase()=='c' || e.key=='Escape'){ clearDisplay(); }
});
</script>

</body>
</html>
